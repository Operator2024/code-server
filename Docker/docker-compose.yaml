---
version: "3.0"
services:
  code-server:
    build:
      dockerfile: ./Dockerfile
      context: .
    image: code-server-npm:${CODE_TAG}
    container_name: code-server
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Etc/UTC
      - PASSWORD=password #optional
      # change password via hasher.py or https://coder.com/docs/code-server/FAQ#can-i-store-my-password-hashed
      #- HASHED_PASSWORD=
      #- SUDO_PASSWORD= #optional
      #- SUDO_PASSWORD_HASH= #optional
      #- PROXY_DOMAIN=${DOMAIN} #optional
      - DEFAULT_WORKSPACE=/config/workspace #optional
    volumes:
      - root_config:/config
    networks:
      local-network:
        ipv4_address: 172.16.239.5
    restart: unless-stopped
  web:
    image: nginx:1.26.1
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf'
      - './templates:/etc/nginx/templates/'
      - './certbot/www/:/var/www/certbot/:ro'
      - './certbot/conf/:/etc/nginx/ssl/:ro'
    networks:
      local-network:
        ipv4_address: 172.16.239.6
    ports:
    - "${HTTP_WEB_PORT}:${HTTP_WEB_PORT}"
    - "${HTTPS_WEB_PORT}:${HTTPS_WEB_PORT}"
    environment:
      - 'NGINX_DOMAIN=${DOMAIN}'
      - 'VS_PORT=${APP_PORT}'
      - 'NGINX_LOCATION=${LOCATION}'
    restart: unless-stopped
  # Enable for sign cert
  # certbot:
  #   image: certbot/certbot:latest
  #   volumes:
  #     - ./certbot/www/:/var/www/certbot/:rw
  #     - ./certbot/conf/:/etc/letsencrypt/:rw

networks:
  local-network:
    ipam:
      driver: default
      config:
        - subnet: "172.16.239.0/24"
          gateway: "172.16.239.1"

volumes:
  root_config:
    name: code-server
    external: false
